name: Release
# One tag run builds and publishes everything: the six CLI archives and six Node packages on
# the GitHub Release, six abi3 wheels + the sdist on PyPI, and unity-rs-core/unity-rs-cli on
# crates.io. CI is not repeated: the gate waits for the green "CI OK" of the tagged commit.
# Manual dispatch is a dry run that builds and checks every artifact and publishes nothing.
# tools/check_ci_matrix.py audits the six-platform shape of this file.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    permissions:
      contents: read
      checks: read
    uses: seiunx-dev/ci-templates/.github/workflows/release-gate.yml@v1
    with:
      version-extra-paths: crates/unity-rs-node/package.json

  cli:
    name: CLI binaries
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/rust-release.yml@v1
    with:
      version: ${{ needs.gate.outputs.version }}
      tag: ${{ needs.gate.outputs.tag }}
      name: unity-rs-cli
      layout: flat
      # stage_cli_artifact.py puts the license, notices and third-party licenses next to the
      # binary; the staged binary itself must answer --help before it is packaged.
      build-command: |
        ext=""; case "$TARGET" in *windows*) ext=.exe ;; esac
        py=$(command -v python3 || command -v python)
        cargo build --release --locked -p unity-rs-cli --target "$TARGET"
        rm -rf target/cli-stage
        "$py" tools/stage_cli_artifact.py "target/$TARGET/release/unity-rs$ext" target/cli-stage
        "./target/cli-stage/unity-rs$ext" --help > /dev/null
        cp target/cli-stage/* "$BIN_DIR/"
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"},
         {"label":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu"},
         {"label":"windows-x64","os":"windows-latest","target":"x86_64-pc-windows-msvc"},
         {"label":"windows-arm64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc"},
         {"label":"macos-x64","os":"macos-15-intel","target":"x86_64-apple-darwin"},
         {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}]

  wheels:
    name: Python wheels
    needs: gate
    uses: seiunx-dev/ci-templates/.github/workflows/maturin-wheels.yml@v1
    with:
      working-directory: crates/unity-rs-python
      targets: >-
        [{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64","manylinux":"2_28"},
         {"label":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64","manylinux":"2_28"},
         {"label":"windows-x64","os":"windows-latest","target":"x64"},
         {"label":"windows-arm64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc"},
         {"label":"macos-x64","os":"macos-15-intel","target":"x86_64-apple-darwin"},
         {"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}]
      python-version: "3.14"
      smoke-import: unity_rs
      test-command: |
        python -I tests/installed_wheel.py
        python -I tests/python_api.py

  # No template builds a napi-rs package: release addon, its tests, the package checks and
  # npm pack, renamed per platform for the GitHub Release.
  node:
    name: Node package (${{ matrix.label }})
    needs: gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: windows-latest
            label: windows-x64
          - os: windows-11-arm
            label: windows-arm64
          - os: macos-15-intel
            label: macos-x64
          - os: macos-latest
            label: macos-arm64
    defaults:
      run:
        working-directory: crates/unity-rs-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache: "false"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/unity-rs-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run test:package
      - name: npm pack
        shell: bash
        env:
          LABEL: ${{ matrix.label }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          npm pack
          mkdir -p out
          mv "unity-rs-node-${VERSION}.tgz" "out/unity-rs-node-${VERSION}-${LABEL}.tgz"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-node-${{ matrix.label }}
          path: crates/unity-rs-node/out/*.tgz
          retention-days: 1
          if-no-files-found: error

  # Every run (dry runs too) checks the set PyPI would get: six wheels and one sdist, all
  # carrying the release version.
  python-dist:
    name: Python distribution set
    needs: [gate, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Validate the distribution set
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, pathlib
          expected = os.environ["VERSION"].replace("-", "_")
          dist = pathlib.Path("dist")
          wheels = sorted(p.name for p in dist.glob("*.whl"))
          sdists = sorted(p.name for p in dist.glob("*.tar.gz"))
          if len(wheels) != 6 or len(sdists) != 1:
              raise SystemExit(f"expected six wheels and one sdist, found {wheels} and {sdists}")
          wrong = [n for n in wheels + sdists if expected not in n]
          if wrong:
              raise SystemExit(f"artifacts do not carry version {expected}: {wrong}")
          print("\n".join(wheels + sdists))
          PY

  # Trusted publishing must run in this (caller) workflow, not in a reusable one.
  pypi:
    name: PyPI
    needs: [gate, cli, node, python-dist]
    if: needs.gate.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/unity-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  publish:
    name: GitHub Release
    needs: [gate, cli, node, pypi]
    if: needs.gate.outputs.is-tag == 'true'
    permissions:
      contents: write
    uses: seiunx-dev/ci-templates/.github/workflows/gh-release.yml@v1
    with:
      tag: ${{ needs.gate.outputs.tag }}
      prerelease: ${{ needs.gate.outputs.prerelease }}
      artifact-pattern: release-*

  crates:
    name: crates.io
    needs: [gate, cli, node, python-dist]
    if: needs.gate.outputs.is-tag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache: "false"
      - uses: seiunx-dev/ci-templates/actions/cargo-publish@v1
        with:
          packages: |
            unity-rs-core
            unity-rs-cli
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
