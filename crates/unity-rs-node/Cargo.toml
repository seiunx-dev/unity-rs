[package]
name = "unity-rs-node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
unity-rs-core = { path = "../unity-rs-core" }
napi = { version = "3.12.1", features = ["napi9"] }
napi-derive = "3.6.3"

[build-dependencies]
napi-build = "2.4.1"

# napi-derive emits the audited Node-API registration glue. This crate's
# handwritten source contains no unsafe blocks, while the pure Rust core keeps
# the workspace-wide unsafe_code=forbid policy.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
