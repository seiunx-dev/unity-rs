[package]
name = "assetstudio-core"
description = "Native Rust implementation of AssetStudio's Unity asset parsing core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
brotli = { version = "8.0.4", default-features = false, features = ["std", "disallow_large_window_size"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
image-webp = { version = "0.2.4", default-features = false }
jpeg-encoder = { version = "0.7.1", default-features = false, features = ["std"] }
lewton = { version = "0.10.2", default-features = false }
lz4_flex = { version = "0.14.0", default-features = false, features = ["safe-decode", "std"] }
lzma-rust2 = { version = "0.18.1", default-features = false, features = ["std"] }
ruopus = { version = "0.1.2", default-features = false, features = ["std"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.1", default-features = false, features = ["mpa"] }
texture2ddecoder = { version = "0.1.2", default-features = false, features = ["alloc"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.13.3", default-features = false }

[dev-dependencies]
zune-jpeg = { version = "0.5.15", default-features = false, features = ["std"] }

[lints]
workspace = true
