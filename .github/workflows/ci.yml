name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PRs: one group per PR, newer pushes cancel older runs. Everything else: one group per
# event and commit, so a queued main run is never replaced by a newer one (every commit keeps
# its "CI OK" for the release gate).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      coverage: true # toolchain 1.88.0 from rust-toolchain.toml (= MSRV)
      env: RUSTDOCFLAGS=-D warnings
      # The repository's structural audits and their self-tests run with the lint job.
      extra-lint-command: |
        python3 tools/test_local_ci.py
        python3 tools/check_python_api_surface.py
        python3 tools/test_python_api_surface.py
        python3 tools/check_node_api_surface.py
        python3 tools/test_node_api_surface.py
        python3 tools/check_ci_matrix.py
        python3 tools/test_ci_matrix.py
        cargo doc --workspace --no-deps --locked
        rm -rf target/package
        cargo package --locked -p unity-rs-core
        python3 tools/generate_dependency_licenses.py --check
        python3 tools/check_delivery_scope.py
        python3 tools/test_delivery_scope.py
        python3 tools/check_core_package.py

  rust-windows:
    name: Rust (Windows)
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      runs-on: windows-latest
      cache-key-prefix: rust-windows
      lint: false # tests only, as before; the Linux call lints the workspace

  rust-macos:
    name: Rust (macOS)
    uses: seiunx-dev/ci-templates/.github/workflows/rust-ci.yml@v1
    with:
      runs-on: macos-latest
      cache-key-prefix: rust-macos
      lint: false # tests only, as before; the Linux call lints the workspace

  # Not in rust-ci: RustSec audit of the lock file, with a prebuilt cargo-audit.
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit@0.22.2
      - run: cargo audit --file Cargo.lock --deny unsound --deny yanked

  # No template builds a napi-rs addon: debug addon, API/type tests and the package checks
  # on the three desktop OSes.
  node:
    name: Node-API (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: crates/unity-rs-node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache-key: node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/unity-rs-node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build:debug
      - run: npm test
      - run: npm run test:package

  # The abi3 wheel on every release platform (PRs: two of them), installed into Python 3.14
  # (abi3 forward compatibility) and run through the installed-wheel and public API suites.
  wheels:
    name: Python wheels
    uses: seiunx-dev/ci-templates/.github/workflows/maturin-wheels.yml@v1
    with:
      working-directory: crates/unity-rs-python
      targets: >-
        ${{ github.event_name == 'pull_request' && '[{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64","manylinux":"2_28"},{"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}]' || '[{"label":"linux-x64","os":"ubuntu-latest","target":"x86_64","manylinux":"2_28"},{"label":"linux-arm64","os":"ubuntu-24.04-arm","target":"aarch64","manylinux":"2_28"},{"label":"windows-x64","os":"windows-latest","target":"x64"},{"label":"windows-arm64","os":"windows-11-arm","target":"aarch64-pc-windows-msvc"},{"label":"macos-x64","os":"macos-15-intel","target":"x86_64-apple-darwin"},{"label":"macos-arm64","os":"macos-latest","target":"aarch64-apple-darwin"}]' }}
      python-version: "3.14"
      sdist: false
      smoke-import: unity_rs
      test-command: |
        python -I tests/installed_wheel.py
        python -I tests/python_api.py

  # Not in maturin-wheels: the Python 3.9 floor, the source distribution (contents check, a
  # wheel rebuilt from it and both suites against that wheel) and the strict mypy consumer.
  python-floor:
    name: Python 3.9 floor and sdist
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/unity-rs-python
    env:
      MATURIN_VERSION: 1.13.3
      MYPY_VERSION: 1.18.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache-key: python-floor
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: py
        with:
          python-version: "3.9"
      - run: |
          python -m pip install --only-binary :all: "maturin==${MATURIN_VERSION}" "mypy==${MYPY_VERSION}"
      - name: Wheel for the 3.9 floor
        run: |
          maturin build --release --locked --interpreter "${{ steps.py.outputs.python-path }}" --out dist
          python -c "import glob, subprocess, sys; w = glob.glob('dist/*.whl'); assert len(w) == 1, w; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', w[0]])"
          python -I tests/installed_wheel.py
          python -I tests/python_api.py
      - name: Strict public API consumer
        run: python -m mypy tests/typecheck_api.py
      # Maturin prunes the workspace inside an sdist to Core + Python; the wheel rebuilt from it
      # proves that pruned workspace still compiles and passes both suites.
      - name: Source distribution
        run: |
          maturin build --release --sdist --compatibility pypi --interpreter "${{ steps.py.outputs.python-path }}" --out sdist-dist
          python tests/sdist_contents.py sdist-dist
          python -c "import glob, subprocess, sys; w = glob.glob('sdist-dist/*.whl'); assert len(w) == 1, w; subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', w[0]])"
          python -I tests/installed_wheel.py
          python -I tests/python_api.py

  # The three differential oracles (AssetStudio/.NET, vgmstream, UnityPy) on one shared build.
  oracles:
    name: Differential oracles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UNITY_RS_ORACLE_REPO: ${{ github.workspace }}/managed-oracle-source
      VGMSTREAM_VERSION: r2117
      UNITYPY_VERSION: 1.25.0
      MATURIN_VERSION: 1.13.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned to the revision the differential was last validated against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Team-Haruki/AssetStudio
          ref: 5829998bc4c3bdcddc66dd7e77fb4ec557d4321b
          path: managed-oracle-source
          persist-credentials: false
      - uses: seiunx-dev/ci-templates/actions/setup-rust@v1
        with:
          cache-key: oracle
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: ./scripts/ci/run-oracles.sh

  # Coverage of the Python tooling under tools/ for Sonar (rust-ci only measures Rust).
  tools:
    name: Python tool coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --only-binary :all: coverage==7.15.4
          python -m coverage erase
          for test in tools/test_ci_matrix.py tools/test_delivery_scope.py \
                      tools/test_decode_astc_references.py tools/test_extracted_corpus_diff.py \
                      tools/test_local_ci.py tools/test_node_api_surface.py \
                      tools/test_python_api_surface.py tools/test_validate_fbx_ascii.py \
                      tools/test_validate_fbx_binary.py tools/test_validate_png_output.py; do
            python -m coverage run --append "$test"
          done
          python -m coverage xml -o coverage/python.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python
          path: coverage/
          retention-days: 3

  sonar:
    name: Sonar
    needs: [rust, tools]
    uses: seiunx-dev/ci-templates/.github/workflows/sonar.yml@v1
    with:
      project-version: auto
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  workflows:
    name: Workflow lint
    uses: seiunx-dev/ci-templates/.github/workflows/actionlint.yml@v1

  ci-ok:
    name: CI OK # the only required status check
    if: always()
    needs: [rust, rust-windows, rust-macos, audit, node, wheels, python-floor, oracles, tools, sonar, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
