[package]
name = "unity-rs-python"
description = "Native Python bindings for unity-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
unity-rs-core = { version = "0.5.1", path = "../unity-rs-core" }
pyo3 = { version = "0.29.0", features = ["abi3-py39"] }

[lints]
workspace = true
