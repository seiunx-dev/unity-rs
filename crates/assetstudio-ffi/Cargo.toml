[package]
name = "assetstudio-ffi"
description = "Stable C ABI frontend for the native Rust AssetStudio engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Team-Haruki/unity-rs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
assetstudio-core = { path = "../assetstudio-core" }
libc = "0.2.189"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"

[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
